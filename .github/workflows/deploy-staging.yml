name: Deploy staging

# 14.4: rewritten from Terraform/ECS to Docker Compose over SSH, per
# the locked "Docker only, no Terraform, no AWS" decision (CONTEXT.md,
# docs/architecture/2026-09-22-prd-v2-alignment.md 14.2-14.4). Manual
# dispatch only, unchanged from before -- staging is a real environment
# (now a single Docker host reached over SSH instead of AWS), and this
# project still has no separate release-branch convention to gate an
# automatic trigger on.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm a real staging deploy.'
        required: true

env:
  # ghcr.io is the natural default here: this is a GitHub repo, so
  # pushing to GitHub Container Registry needs no extra account/secret
  # beyond the workflow's own GITHUB_TOKEN -- unlike ECR, which needed
  # its own IAM role (the deleted aws-actions/configure-aws-credentials
  # step) purely to hold images ECS pulled from.
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    if: github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api/worker/customer-web images
        env:
          IMAGE_TAG: ${{ github.sha }}
          # GitHub Actions `${{ }}` expressions are compiled before this
          # script runs at all -- they have no visibility into the `for
          # service in ...` loop's own shell variable below, so
          # customer-web's one extra build arg (its Dockerfile inlines
          # NEXT_PUBLIC_API_BASE_URL at build time, per web.Dockerfile's
          # own comment) has to be a plain shell conditional inside the
          # loop, not a workflow-level expression.
          NEXT_PUBLIC_API_BASE_URL: https://api.${{ secrets.STAGING_DOMAIN }}
        run: |
          set -euo pipefail
          declare -A DOCKERFILES=(
            [api]=infrastructure/docker/api.Dockerfile
            [worker]=infrastructure/docker/worker.Dockerfile
            [customer-web]=infrastructure/docker/web.Dockerfile
          )
          for service in api worker customer-web; do
            BUILD_ARGS=()
            if [ "$service" = "customer-web" ]; then
              BUILD_ARGS=(--build-arg "NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL")
            fi
            docker build \
              -f "${DOCKERFILES[$service]}" \
              "${BUILD_ARGS[@]}" \
              -t "$IMAGE_NAMESPACE/$service:$IMAGE_TAG" \
              -t "$IMAGE_NAMESPACE/$service:latest" \
              .
            docker push "$IMAGE_NAMESPACE/$service:$IMAGE_TAG"
            docker push "$IMAGE_NAMESPACE/$service:latest"
          done

      # ClamAV is no longer mirrored into a private registry (ecr.tf's
      # own reasoning, deleted in 14.2) -- docker-compose.prod.yml pulls
      # clamav/clamav:stable directly from quay.io on the staging host
      # itself, the same way it already pulls postgres/redis/minio;
      # nothing in this Compose-over-SSH deploy shape requires every
      # image to originate from one private registry the way ECS did.

      # §12.8's own "migration strategy" still holds here: run
      # migrations with the *new* api image, before api/worker roll onto
      # it -- Prisma's migrate deploy is designed to be safe to run
      # ahead of the code that depends on the resulting schema
      # (additive migrations, this project's migration history never
      # having dropped a column a still-running old container reads).
      # docker-compose.prod.yml's own api/worker service definitions
      # supply every other env var already (14.3); only the three image
      # tags need to be pinned to this deploy's own commit SHA, which is
      # what API_IMAGE/WORKER_IMAGE/CUSTOMER_WEB_IMAGE below do.
      - name: Deploy over SSH with Docker Compose
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_NAMESPACE: ${{ env.IMAGE_NAMESPACE }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          # The remote host holds its own persistent
          # infrastructure/docker/.env.prod (real secrets -- never
          # written by this pipeline, matching 14.3's README) at
          # STAGING_COMPOSE_DIR, checked out or synced there ahead of
          # time; this step only ever pulls new images and reapplies
          # the compose file, it never provisions the host itself.
          envs: IMAGE_NAMESPACE,IMAGE_TAG
          script: |
            set -euo pipefail
            cd "${{ secrets.STAGING_COMPOSE_DIR }}"
            export API_IMAGE="$IMAGE_NAMESPACE/api:$IMAGE_TAG"
            export WORKER_IMAGE="$IMAGE_NAMESPACE/worker:$IMAGE_TAG"
            export CUSTOMER_WEB_IMAGE="$IMAGE_NAMESPACE/customer-web:$IMAGE_TAG"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose --env-file infrastructure/docker/.env.prod \
              -f infrastructure/docker/docker-compose.prod.yml pull api worker customer-web
            docker compose --env-file infrastructure/docker/.env.prod \
              -f infrastructure/docker/docker-compose.prod.yml \
              run --rm api pnpm --filter @print-automated/api exec prisma migrate deploy
            docker compose --env-file infrastructure/docker/.env.prod \
              -f infrastructure/docker/docker-compose.prod.yml up -d api worker customer-web

      # §12.8's own "post-deploy smoke test", unchanged from before --
      # infrastructure/scripts/smoke-test.mjs was already deployment-
      # shape-agnostic (plain HTTP calls against STAGING_API_URL/
      # STAGING_WEB_URL, no AWS SDK, no ECS/Terraform assumption), so
      # this step needed no rewrite, only re-verification (see the
      # commit message). This is the gate: a non-zero exit here fails
      # the whole job.
      - name: Post-deploy smoke test -- gates on /v1/health/ready
        env:
          STAGING_API_URL: https://api.${{ secrets.STAGING_DOMAIN }}
          STAGING_WEB_URL: https://${{ secrets.STAGING_DOMAIN }}
        run: node infrastructure/scripts/smoke-test.mjs

      # Only reachable manually (this job doesn't call it on smoke-test
      # failure automatically) -- forcing an unattended rollback risks
      # compounding a bad deploy with a bad rollback while nobody's
      # watching; a human confirming first, using the same script this
      # pipeline itself would run, is the safer default.
      - name: On smoke test failure, rollback is available
        if: failure()
        run: |
          echo "Smoke test failed. Roll back with:"
          echo "  SSH_HOST=<staging host> SSH_USER=<ssh user> COMPOSE_DIR=<remote path> \\"
          echo "  ROLLBACK_TAG=<previous known-good commit SHA> ./infrastructure/scripts/rollback.sh"
