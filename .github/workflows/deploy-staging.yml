name: Deploy staging

# §12.8: deploy pipeline to staging. Manual dispatch, not on every push
# to main -- staging is a real, billed AWS environment (12.7's own
# Terraform), and this project has no separate release-branch
# convention to gate an automatic trigger on.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm a real staging deploy.'
        required: true

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: print-automated
  ENVIRONMENT: staging

jobs:
  deploy:
    if: github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build, tag and push api/worker/web images
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          # GitHub Actions `${{ }}` expressions are compiled before this
          # script runs at all -- they have no visibility into the `for
          # service in ...` loop's own shell variable below, so web's
          # one extra build arg (12.6's own NEXT_PUBLIC_API_BASE_URL
          # requirement) has to be a plain shell conditional inside the
          # loop, not a workflow-level expression.
          NEXT_PUBLIC_API_BASE_URL: https://api.${{ secrets.STAGING_DOMAIN }}
        run: |
          for service in api worker web; do
            BUILD_ARGS=()
            if [ "$service" = "web" ]; then
              BUILD_ARGS=(--build-arg "NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL")
            fi
            docker build \
              -f "infrastructure/docker/${service}.Dockerfile" \
              "${BUILD_ARGS[@]}" \
              -t "$ECR_REGISTRY/$PROJECT_NAME-$ENVIRONMENT-${service}:$IMAGE_TAG" \
              .
            docker push "$ECR_REGISTRY/$PROJECT_NAME-$ENVIRONMENT-${service}:$IMAGE_TAG"
          done

      # §101's own risk table: ClamAV is a third-party image, not built
      # from this repo -- mirrored into this account's own ECR (ecr.tf's
      # own reasoning) rather than built here.
      - name: Mirror the upstream ClamAV image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker pull clamav/clamav:stable
          docker tag clamav/clamav:stable "$ECR_REGISTRY/$PROJECT_NAME-$ENVIRONMENT-clamav:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$PROJECT_NAME-$ENVIRONMENT-clamav:$IMAGE_TAG"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform apply
        working-directory: infrastructure/terraform
        env:
          TF_VAR_domain_name: ${{ secrets.STAGING_DOMAIN }}
          TF_VAR_image_tag: ${{ github.sha }}
          TF_VAR_alarm_sns_topic_arn: ${{ secrets.ALARM_SNS_TOPIC_ARN }}
        run: |
          terraform init
          terraform apply -auto-approve

      # §12.8's own "migration strategy": run migrations as a one-off
      # ECS task using the *new* api image, BEFORE the api/worker
      # services roll onto it -- Prisma's own migrate deploy is
      # designed to be safe to run repeatedly and ahead of the code
      # that depends on the resulting schema (additive migrations,
      # this project's own migration history never having dropped a
      # column a still-running old task reads). `terraform apply` above
      # already updated the task definitions' image tag but ECS only
      # rolls a *service* onto a new revision when told to -- the
      # explicit `ecs update-service` calls below are that rollout,
      # deliberately sequenced after this task succeeds.
      - name: Run database migrations
        run: |
          CLUSTER="${PROJECT_NAME}-${ENVIRONMENT}"
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "${PROJECT_NAME}-${ENVIRONMENT}-api" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          SUBNETS=$(terraform -chdir=infrastructure/terraform output -json private_subnet_ids | jq -r 'join(",")')
          SG=$(terraform -chdir=infrastructure/terraform output -raw ecs_api_security_group_id)
          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"api","command":["pnpm","--filter","@print-automated/api","exec","prisma","migrate","deploy"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration task failed with exit code $EXIT_CODE -- aborting before any service is updated."
            exit 1
          fi

      - name: Roll api/worker/web services onto the new images
        run: |
          CLUSTER="${PROJECT_NAME}-${ENVIRONMENT}"
          for service in api worker web; do
            aws ecs update-service \
              --cluster "$CLUSTER" \
              --service "${PROJECT_NAME}-${ENVIRONMENT}-${service}" \
              --force-new-deployment
          done
          for service in api worker web; do
            aws ecs wait services-stable --cluster "$CLUSTER" --services "${PROJECT_NAME}-${ENVIRONMENT}-${service}"
          done

      - name: Post-deploy smoke test
        env:
          STAGING_API_URL: https://api.${{ secrets.STAGING_DOMAIN }}
          STAGING_WEB_URL: https://${{ secrets.STAGING_DOMAIN }}
        run: node infrastructure/scripts/smoke-test.mjs

      # §12.8's own "rollback procedure." Only reachable manually (this
      # job doesn't call it on smoke-test failure automatically) --
      # forcing an unattended rollback risks compounding a bad deploy
      # with a bad rollback while nobody's watching; a human confirming
      # first, using the same script this pipeline itself would run, is
      # the safer default for a staging environment's first iteration.
      - name: On smoke test failure, rollback is available
        if: failure()
        run: |
          echo "Smoke test failed. Roll back with:"
          echo "  AWS_REGION=$AWS_REGION PROJECT_NAME=$PROJECT_NAME ENVIRONMENT=$ENVIRONMENT ./infrastructure/scripts/rollback.sh"
