name: print-automated-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: print_automated
      POSTGRES_PASSWORD: print_automated_dev
      POSTGRES_DB: print_automated
    ports:
      # Host 5433, not the default 5432: this machine already runs an
      # unrelated Postgres container (project "print automater by
      # antigravity") bound to 5432. Container-internal port is unchanged.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U print_automated -d print_automated"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # Host 6380: default 6379 is already bound by the unrelated
      # "print automater by antigravity" stack on this machine.
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Docker Hub's minio/minio repo no longer serves anonymous pulls;
    # quay.io is MinIO's current recommended registry.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      # Host 9010/9011: default 9000/9001 are already bound by the
      # unrelated "print automater by antigravity" stack on this machine.
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      (mc mb -p local/print-automated-documents || true) &&
      mc anonymous set none local/print-automated-documents &&
      exit 0
      "

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8025"]
      interval: 5s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 120s

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:
